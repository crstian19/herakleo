[package]
name = "herakleo"
version = "0.1.0"
description = "IPTV player (Tauri build)"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "herakleo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
futures-util = "0.3.34"

[target.'cfg(target_os = "linux")'.dependencies]
# Same version Tauri already links: opens links with an activation token.
gtk = "0.18.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
